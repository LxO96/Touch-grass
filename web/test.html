<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Touch Grass — logic tests</title>
<style>
 body { font: 14px/1.5 monospace; background: #303e4e; color: #eee; padding: 20px; }
 pre { white-space: pre-wrap; }
 .p { color: #8fd46a; } .f { color: #ff8080; font-weight: bold; }
 h1 { font: bold 20px monospace; }
</style>
</head>
<body>
<h1>Touch Grass — logic tests</h1>
<pre id="out">running…</pre>

<script>
window.addEventListener('error', (e) => {
  document.getElementById('out').textContent =
    'THREW: ' + e.message + '\n  at ' + e.filename + ':' + e.lineno + ':' + e.colno;
});
</script>
<script src="scoring.js"></script>
<script src="blend.js"></script>
<script src="fixtures.js"></script>
<script src="met-legend.js"></script>
<script src="lang.js"></script>
<script src="core.js"></script>
<script>
/* ================= harness ================= */

const lines = [];
let nPass = 0, nFail = 0;

function check(name, got, want) {
  const ok = got === want;
  ok ? nPass++ : nFail++;
  lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}` + (ok ? '' : `\n        got=${got}\n        want=${want}`));
}

/* ================= fixtures ================= */

// Copy is asserted in English; getLang() otherwise follows the browser,
// which on a Swedish machine would make every string test fail.
const REAL_LANG = localStorage.getItem('touchgrass.lang');
localStorage.setItem('touchgrass.lang', 'en'); LANG_CACHE = null;

const S = Object.assign({}, DEFAULTS);            // default dials

// A pleasant spring afternoon, unless overridden.
const base = { feels: 20, temp: 20, pop: 5, precip: 0, wind: 8,
               isDay: true, hour: 14, code: 0 };
const at = (o) => Object.assign({}, base, o);

function fc(specs, s) {
  return specs.map((spec, i) => {
    const h = at(Object.assign({ hour: (base.hour + i + 1) % 24 }, spec));
    h.hoursFromNow = i + 1;
    h.label = h.hour === 0 ? 'midnight' : h.hour < 12 ? h.hour + 'am'
            : h.hour === 12 ? 'noon' : (h.hour - 12) + 'pm';
    h.score = scoreHour(h, s || S);
    return h;
  });
}
const flat = (n, o, s) => fc(Array.from({ length: n }, () => o || {}), s);

const WET  = { pop: 100, precip: 3, code: 65 };
const NIGHT = { isDay: false, hour: 3 };

/* ================= scoring ================= */

check('perfect afternoon scores high', scoreHour(at({}), S) >= 90, true);
check('heavy rain tanks it', scoreHour(at(WET), S) < 25, true);
check('night costs a lot', scoreHour(at({ isDay: false, hour: 21 }), S) < 65, true);
check('3am costs more than 9pm',
  scoreHour(at(NIGHT), S) < scoreHour(at({ isDay: false, hour: 21 }), S), true);
check('score never leaves 0..100',
  (() => { const v = scoreHour(at({ feels: -40, pop: 100, precip: 9, wind: 90,
      isDay: false, hour: 3, code: 96 }), S); return v >= 0 && v <= 100; })(), true);

/* ================= dials actually do something ================= */

check('rain dial at 0 rescues a wet hour',
  scoreHour(at(WET), Object.assign({}, S, { rain: 0 })) >
  scoreHour(at(WET), S) + 40, true);

check('rain dial at 2 punishes harder than default',
  scoreHour(at({ pop: 60 }), Object.assign({}, S, { rain: 2 })) <
  scoreHour(at({ pop: 60 }), S), true);

check('cold dial at 0 rescues a chilly hour',
  scoreHour(at({ feels: 2 }), Object.assign({}, S, { cold: 0 })) >= 95, true);

check('heat dial at 0 rescues a hot hour',
  scoreHour(at({ feels: 34 }), Object.assign({}, S, { heat: 0 })) >= 95, true);

check('dark dial at 0 makes night as good as day',
  scoreHour(at(NIGHT), Object.assign({}, S, { dark: 0 })) ===
  scoreHour(at({ hour: 14 }), S), true);

check('wind dial at 0 rescues a gale',
  scoreHour(at({ wind: 60 }), Object.assign({}, S, { wind: 0 })) >= 95, true);

check('dials stay clamped to 0..2 when stored out of range',
  (() => {
    localStorage.setItem('touchgrass.settings',
      JSON.stringify({ rain: 99, cold: -5, bar: 999 }));
    const g = getSettings();
    localStorage.removeItem('touchgrass.settings');
    return g.rain === 2 && g.cold === 0 && g.bar === 90;
  })(), true);

check('a lower bar sends you out in worse weather',
  (() => {
    const mediocre = at({ pop: 55, feels: 12 });
    const ahead = flat(12, { pop: 55, feels: 12 });
    const fussy  = decide(mediocre, ahead, 0, Object.assign({}, S, { bar: 85 }));
    const relaxed = decide(mediocre, ahead, 0, Object.assign({}, S, { bar: 30 }));
    return fussy.state !== 'go' && relaxed.state === 'go';
  })(), true);

/* ================= THE HOUSE RULE ================= */
/* If you have not been out today, it must never say "stay in". */

/* Both sweeps build their forecasts with since(), not flat(): flat() copies
   a spec that carries `hour` over the hour it computes, so every row came
   back stamped with now's hour. Since the verdict began naming only hours
   still ahead of now, that made the candidate list empty in all ~2,600
   combinations — the sweeps ran, and swept nothing. since() advances the
   hours properly, so the rule is exercised on the path that has something
   to name as well as the one that doesn't. */

check('house rule: never "stayin" before your first trip',
  (() => {
    const dials = [S, Object.assign({}, S, { bar: 90 }),
                      Object.assign({}, S, { rain: 2, cold: 2, dark: 2 })];
    for (const s of dials) {
      for (const feels of [-30, -16, -5, 5, 12, 20, 30, 39, 45]) {
        for (const hour of [0, 3, 6, 9, 12, 15, 18, 21, 23]) {
          for (const isDay of [true, false]) {
            for (const code of [0, 3, 45, 63, 65, 75, 95, 96]) {
              for (const wind of [2, 30, 70]) {
                const now = at({ feels, hour, isDay, code, wind });
                const spec = { feels, isDay, code, wind };
                const ahead = since(hour, Array.from({ length: 12 }, () => spec), s);
                const v = decide(now, ahead, 0, s);
                if (v.state === 'stayin') {
                  return `stayin leaked: feels=${feels} hour=${hour} code=${code}`;
                }
              }
            }
          }
        }
      }
    }
    return 'clean';
  })(), 'clean');

// Asserted on the decision itself rather than its wording, so it holds
// in every language.
check('house rule: every not-been-out verdict is actionable',
  (() => {
    // The only outcomes allowed to name no specific hour are the ones
    // where there genuinely isn't one to name.
    const mayLackAnHour = ['waitRiskyNoGap', 'go', 'anyways'];
    for (const feels of [-20, 5, 20, 40]) {
      for (const isDay of [true, false]) {
        for (const code of [0, 65, 95]) {
          const hour = isDay ? 14 : 2;
          const now = at({ feels, isDay, hour, code });
          const spec = { feels, isDay, code };
          const d = tgDecide(now,
            since(hour, Array.from({ length: 12 }, () => spec)), 0, S);
          if (d.state === 'stayin') return 'stayin leaked';
          if (!mayLackAnHour.includes(d.state) && !d.target) {
            return 'no hour named for ' + d.state;
          }
        }
      }
    }
    return 'clean';
  })(), 'clean');

check('"stay in" IS reachable once you have been out',
  decide(at(WET), flat(12, WET), 1, S).state, 'stayin');

/* ================= safety still wins ================= */

check('dangerous heat never says go',
  decide(at({ feels: 44 }), flat(12, { feels: 44 }), 0, S).state !== 'go'
  && decide(at({ feels: 44 }), flat(12, { feels: 44 }), 0, S).state !== 'anyways', true);

check('dangerous cold never says go',
  decide(at({ feels: -22 }), flat(12, { feels: -22 }), 0, S).state, 'wait');

check('lightning never says go',
  decide(at({ code: 95 }), flat(12, { code: 95 }), 0, S).state, 'wait');

check('safety beats a wide-open bar',
  decide(at({ feels: 44 }), flat(12, { feels: 44 }), 0,
         Object.assign({}, S, { bar: 25, heat: 0 })).state, 'wait');

check('safety beats every dial turned off',
  (() => {
    const off = { rain: 0, cold: 0, heat: 0, wind: 0, dark: 0, bar: 25 };
    for (const now of [at({ feels: 45 }), at({ feels: -25 }), at({ code: 95 })]) {
      const v = decide(now, flat(12, {}, off), 0, off);
      if (v.state === 'go' || v.state === 'anyways') return 'unsafe: ' + v.line;
    }
    return 'clean';
  })(), 'clean');

/* ================= night ================= */

// flat() would stamp the same `hour` on every forecast row, because the
// spec it copies carries one — which made every "future" hour identical
// to now. since() advances them properly, which matters now that the
// verdict cares which side of midnight an hour falls on.
//
// 23:00 is deliberately not in this list: with no hours left of today it
// now says go now, which "the day you owe is today" section pins.
check('"go out anyways" never happens in the small hours',
  (() => {
    for (const hour of [0, 1, 2, 3, 4]) {
      const spec = Object.assign({ isDay: false }, WET);
      const ahead = since(hour, Array.from({ length: 12 }, () => spec));
      const v = decide(at(Object.assign({ hour }, spec)), ahead, 0, S);
      if (v.state === 'anyways') return `leaked at ${hour}h`;
    }
    return 'clean';
  })(), 'clean');

// Deliberate: a dark winter *evening* is still a fine time to go out, so
// "anyways" is allowed there. Only 11pm–5am is off limits.
check('a dark winter evening still gets pushed out',
  (() => {
    const spec = Object.assign({ isDay: false, hour: 18 }, WET);
    return decide(at(spec), flat(12, spec), 0, S).state;
  })(), 'anyways');

check('the small hours still name an hour to go',
  (() => {
    const spec = Object.assign({ isDay: false }, WET);
    const d = tgDecide(at(Object.assign({ hour: 2 }, spec)),
                       since(2, Array.from({ length: 12 }, () => spec)), 0, S);
    return d.state === 'waitNight' && !!d.target;
  })(), true);

// Two different silences. At 23:00 the forecast is full but every hour in
// it belongs to tomorrow, so the day is spent and the answer is "now"
// (pinned below, under "the day you owe is today"). With no forecast at
// all there is nothing to say "now" about either — and lang.js carries
// copy written for exactly that, in both languages.
check('deep night with no forecast at all still waits for the night',
  (() => {
    const spec = Object.assign({ isDay: false }, WET);
    const d = tgDecide(at(Object.assign({ hour: 3 }, spec)), [], 0, S);
    return d.state + ':' + d.target;
  })(), 'waitNight:null');

check('and it uses the words written for having no hour to name',
  (() => {
    const spec = Object.assign({ isDay: false }, WET);
    return decide(at(Object.assign({ hour: 3 }, spec)), [], 0, S).sub;
  })(),
  "It's the middle of the night. Get some sleep, then go out at the first " +
  "reasonable hour — that's all today asks.");

/* ================= copy ================= */

check('no undefined/NaN in any verdict copy',
  (() => {
    for (const feels of [-30, -16, -5, 10, 20, 30, 39, 45]) {
      for (const hour of [3, 9, 15, 21]) {
        for (const isDay of [true, false]) {
          for (const visits of [0, 1, 2, 5]) {
            for (const code of [0, 3, 65, 95, 75]) {
              const v = decide(at({ feels, hour, isDay, code }),
                               flat(12, { feels, hour, isDay, code }), visits, S);
              const txt = v.line + ' ' + v.sub + ' ' + v.tag;
              if (/undefined|NaN|\[object/.test(txt)) return txt.slice(0, 70);
            }
          }
        }
      }
    }
    return 'clean';
  })(), 'clean');

check('every verdict has a state the CSS knows',
  (() => {
    const known = ['go', 'wait', 'anyways', 'stayin'];
    for (const feels of [-30, 5, 20, 44]) {
      for (const isDay of [true, false]) {
        for (const visits of [0, 1]) {
          const v = decide(at({ feels, isDay, hour: isDay ? 14 : 2 }),
                           flat(12, { feels, isDay }), visits, S);
          if (!known.includes(v.state)) return 'unknown: ' + v.state;
        }
      }
    }
    return 'clean';
  })(), 'clean');

check('empty forecast does not crash the verdict',
  typeof decide(at({}), [], 0, S).line, 'string');

/* ================= the log ================= */

const REAL_LOG = localStorage.getItem(LOG_KEY);   // borrow, then give back
localStorage.removeItem(LOG_KEY);

check('a fresh log is empty', Object.keys(getLog()).length, 0);

check('adding a visit counts it', (() => { addVisit(); return visitsToday(); })(), 1);
check('visits stack up', (() => { addVisit(); addVisit(); return visitsToday(); })(), 3);
check('undo removes one', (() => { removeVisit(); return visitsToday(); })(), 2);
check('undo cannot go below zero',
  (() => { removeVisit(); removeVisit(); removeVisit(); return visitsToday(); })(), 0);
check('a zeroed day is dropped, not stored as 0',
  Object.prototype.hasOwnProperty.call(getLog(), todayKey()), false);

check('rubbish entries are filtered out of the log',
  (() => {
    localStorage.setItem(LOG_KEY, JSON.stringify({
      '2026-01-05': 2, 'nonsense': 4, '2026-13-99': 1, '2026-02-02': 'x',
      '2026-03-03': -1, '2026-02-30': 1, '2026-00-10': 1
    }));
    const keys = Object.keys(getLog()).sort();
    return keys.join(',');
  })(), '2026-01-05');

check('a leap day is accepted in a leap year but not otherwise',
  validKey('2028-02-29') && !validKey('2026-02-29'), true);

check('a corrupt log does not throw',
  (() => { localStorage.setItem(LOG_KEY, '{not json'); return Object.keys(getLog()).length; })(), 0);

check('streak counts consecutive days back from today',
  (() => {
    const log = {};
    const d = new Date();
    for (let i = 0; i < 5; i++) { log[dayKey(d)] = 1; d.setDate(d.getDate() - 1); }
    return streakInfo(log).current;
  })(), 5);

check('a streak survives today being still unlogged',
  (() => {
    const log = {};
    const d = new Date();
    d.setDate(d.getDate() - 1);            // yesterday back, today blank
    for (let i = 0; i < 4; i++) { log[dayKey(d)] = 1; d.setDate(d.getDate() - 1); }
    return streakInfo(log).current;
  })(), 4);

check('a gap ends the streak',
  (() => {
    const log = {};
    const d = new Date();
    log[dayKey(d)] = 1;
    d.setDate(d.getDate() - 2);            // skip yesterday
    log[dayKey(d)] = 1;
    return streakInfo(log).current;
  })(), 1);

check('longest run is found anywhere in history',
  streakInfo({
    '2026-01-01': 1, '2026-01-02': 1, '2026-01-03': 1,   // run of 3
    '2026-06-10': 1                                       // lonely day
  }).longest, 3);

check('trips this year sums multiple trips per day',
  (() => {
    const y = new Date().getFullYear();
    return streakInfo({ [`${y}-01-01`]: 3, [`${y}-01-02`]: 2 }).tripsThisYear;
  })(), 5);

check('days out counts days, not trips',
  (() => {
    const y = new Date().getFullYear();
    return streakInfo({ [`${y}-01-01`]: 3, [`${y}-01-02`]: 2 }).daysThisYear;
  })(), 2);

check('a leap year has 366 squares',
  (() => {
    const jan1 = new Date(2028, 0, 1), dec31 = new Date(2028, 11, 31);
    return Math.round((dec31 - jan1) / 86400000) + 1;
  })(), 366);

check('dayKey zero-pads so keys sort correctly',
  dayKey(new Date(2026, 2, 5)), '2026-03-05');

// put the user's real log back exactly as we found it
if (REAL_LOG === null) localStorage.removeItem(LOG_KEY);
else localStorage.setItem(LOG_KEY, REAL_LOG);

check('the real log was restored after testing',
  localStorage.getItem(LOG_KEY), REAL_LOG);


/* ================= trends ================= */

// helper: an `ahead` array with explicit per-hour overrides
function ahead12(fn) {
  const out = [];
  for (let k = 1; k <= 12; k++) {
    const h = at(Object.assign({ hour: (14 + k) % 24 }, fn(k)));
    h.hoursFromNow = k;
    h.label = h.hour < 12 ? h.hour + 'am' : (h.hour - 12) + 'pm';
    h.score = scoreHour(h, S);
    out.push(h);
  }
  return out;
}

check('rain clearing up reads as drying',
  trends(at({ pop: 90 }), ahead12(() => ({ pop: 5 })), S).rain.text, 'drying');

check('rain moving in reads as wetter and worse',
  (() => {
    const t = trends(at({ pop: 0 }), ahead12(() => ({ pop: 95 })), S).rain;
    return t.text + '/' + t.mood;
  })(), 'wetter/worse');

check('a steady day reads as steady',
  trends(at({ pop: 20 }), ahead12(() => ({ pop: 20 })), S).rain.text, 'steady');

check('warming up on a cold day is better',
  (() => {
    const t = trends(at({ feels: 4 }), ahead12(() => ({ feels: 18 })), S).temp;
    return t.text + '/' + t.mood;
  })(), 'warmer/better');

// The same direction of travel means opposite things at opposite ends.
check('warming up in a heatwave is worse',
  (() => {
    const t = trends(at({ feels: 28 }), ahead12(() => ({ feels: 36 })), S).temp;
    return t.text + '/' + t.mood;
  })(), 'warmer/worse');

check('cooling off in a heatwave is better',
  (() => {
    const t = trends(at({ feels: 34 }), ahead12(() => ({ feels: 22 })), S).temp;
    return t.text + '/' + t.mood;
  })(), 'colder/better');

check('dropping wind reads as calmer',
  trends(at({ wind: 45 }), ahead12(() => ({ wind: 5 })), S).wind.text, 'calmer');

check('outlook spots a better hour coming',
  trends(at(WET), ahead12(() => ({})), S).outlook.mood, 'better');

check('outlook says downhill when now is the peak',
  trends(at({}), ahead12(() => WET), S).outlook.mood, 'worse');

check('outlook reports the best hour still to come, not the average',
  (() => {
    // one glorious hour buried among rubbish ones
    const a = ahead12((k) => (k === 5 ? {} : WET));
    return trends(at(WET), a, S).outlook.best >= 90;
  })(), true);

check('late in the evening it switches to "next few hours"',
  trends(at({ hour: 22, isDay: false }), ahead12(() => ({})), S).label,
  'next few hours');

check('midday uses the rest of today',
  trends(at({ hour: 12 }), ahead12(() => ({})), S).label, 'rest of today');

check('no forecast means no trends, not a crash',
  trends(at({}), [], S), null);

check('every trend arrow has a glyph',
  (() => {
    const t = trends(at({ pop: 50, feels: 10, wind: 30 }),
                     ahead12(() => ({ pop: 0, feels: 20, wind: 5 })), S);
    for (const k of ['outlook', 'temp', 'rain', 'wind']) {
      if (!ARROW[t[k].dir]) return 'missing arrow for ' + k;
    }
    return 'clean';
  })(), 'clean');

/* ================= notification prefs ================= */

const REAL_NOTIFY = localStorage.getItem('touchgrass.notify');
localStorage.removeItem('touchgrass.notify');

check('notify defaults are off until asked for',
  getNotify().enabled || getNotify().watch, false);

check('an inverted quiet window is repaired, not left to never fire',
  (() => {
    localStorage.setItem('touchgrass.notify',
      JSON.stringify({ windowStart: 20, windowEnd: 8 }));
    const n = getNotify();
    return n.windowEnd > n.windowStart;
  })(), true);

check('out-of-range times are clamped',
  (() => {
    localStorage.setItem('touchgrass.notify',
      JSON.stringify({ hour: 99, minute: -5, greatBar: 500 }));
    const n = getNotify();
    return `${n.hour}/${n.minute}/${n.greatBar}`;
  })(), '23/0/100');

check('corrupt notify prefs fall back to defaults',
  (() => {
    localStorage.setItem('touchgrass.notify', 'not json');
    return getNotify().hour;
  })(), NOTIFY_DEFAULTS.hour);

check('hhmm zero-pads',  hhmm(9, 5), '09:05');

if (REAL_NOTIFY === null) localStorage.removeItem('touchgrass.notify');
else localStorage.setItem('touchgrass.notify', REAL_NOTIFY);

check('syncToAndroid is harmless in a browser',
  (() => { try { syncToAndroid(); return 'fine'; } catch (e) { return 'threw: ' + e.message; } })(),
  'fine');


/* ================= reminder timing ================= */

const clockN  = Object.assign({}, NOTIFY_DEFAULTS, { mode: 'clock', hour: 17, minute: 30 });
const sunsetN = Object.assign({}, NOTIFY_DEFAULTS, { mode: 'sunset', beforeSunset: 2 });

check('a fixed time is just that time',
  reminderMinutes(clockN, 19 * 60 + 58), 17 * 60 + 30);

check('sunset mode counts back from sunset',
  reminderMinutes(sunsetN, 19 * 60 + 58), 17 * 60 + 58);

check('half-hour offsets work',
  reminderMinutes(Object.assign({}, sunsetN, { beforeSunset: 1.5 }), 20 * 60), 18 * 60 + 30);

check('zero hours before sunset means at sunset',
  reminderMinutes(Object.assign({}, sunsetN, { beforeSunset: 0 }), 20 * 60), 20 * 60);

// Midwinter in the north: sunset at 14:50 should pull the nudge earlier,
// which is the whole reason this mode exists.
check('a dark midwinter sunset drags the nudge earlier',
  reminderMinutes(sunsetN, 14 * 60 + 50) < reminderMinutes(clockN, 14 * 60 + 50), true);

check('sunset mode falls back to the clock when sunset is unknown',
  reminderMinutes(Object.assign({}, sunsetN, { hour: 17, minute: 0 }), null), 17 * 60);

check('a bad sunset value does not produce NaN',
  Number.isFinite(reminderMinutes(sunsetN, undefined)), true);

check('the due time never escapes the day',
  (() => {
    for (const before of [0, 3, 6]) {
      for (const sunset of [0, 30, 720, 1439]) {
        const m = reminderMinutes(Object.assign({}, sunsetN, { beforeSunset: before }), sunset);
        if (!(m >= 0 && m < 1440)) return `out of range: ${m}`;
      }
    }
    return 'clean';
  })(), 'clean');

check('mode is validated on the way out of storage',
  (() => {
    localStorage.setItem('touchgrass.notify', JSON.stringify({ mode: 'nonsense' }));
    const m = getNotify().mode;
    localStorage.removeItem('touchgrass.notify');
    return m;
  })(), 'clock');

check('hours before sunset are clamped and snapped to halves',
  (() => {
    localStorage.setItem('touchgrass.notify',
      JSON.stringify({ mode: 'sunset', beforeSunset: 99 }));
    const a = getNotify().beforeSunset;
    localStorage.setItem('touchgrass.notify',
      JSON.stringify({ mode: 'sunset', beforeSunset: 1.3 }));
    const b = getNotify().beforeSunset;
    localStorage.removeItem('touchgrass.notify');
    return `${a}/${b}`;
  })(), '6/1.5');

check('clockToMinutes reads an ISO time tail',
  clockToMinutes('19:58'), 19 * 60 + 58);

check('clockToMinutes rejects rubbish',
  clockToMinutes('not a time'), null);

check('minutesToHhmm round-trips',
  minutesToHhmm(clockToMinutes('07:05')), '07:05');


/* ================= languages ================= */

check('both languages are offered',
  LANGS_AVAILABLE.map((l) => l.code).join(','), 'en,sv');

// A corrupt stored value falls through to the browser's preference,
// which is more useful than forcing English on a Swedish phone.
check('an unknown stored language falls back to a supported one',
  (() => {
    localStorage.setItem('touchgrass.lang', 'kl'); LANG_CACHE = null;
    const c = getLang();
    localStorage.setItem('touchgrass.lang', 'en'); LANG_CACHE = null;
    return LANGS_AVAILABLE.some((l) => l.code === c);
  })(), true);

check('the licence line credits every licensor, in both languages', (() => {
  // "Data licensed CC BY 4.0" named nobody, which is not an attribution.
  // MET's locationforecast is NLOD / CC BY 4.0; SMHI's open data CC BY 4.0.
  for (const code of ['en', 'sv']) {
    const s = TEXT[code].ui.sourceLicence;
    if (typeof s !== 'string') return code + ' missing';
    for (const who of ['MET Norway', 'SMHI', 'Open-Meteo', 'NLOD', 'CC BY 4.0']) {
      if (s.indexOf(who) < 0) return code + ' omits ' + who;
    }
  }
  return 'clean';
})(), 'clean');

check('every verdict state has wording in both languages',
  (() => {
    const states = ['go','goAgain','wait','waitAgain','waitDark','waitNight',
                    'waitRisky','waitRiskyNoGap','anywaysBest','anyways','stayin'];
    for (const code of ['en','sv']) {
      for (const st of states) {

/* ================= the day you owe is today ================= */

// An evening forecast reaches into tomorrow morning. The house rule says
// there is always a time attached — but if you have not been out today,
// that time has to be today. These build a forecast from an arbitrary
// hour so the midnight boundary can be crossed on purpose.
function since(nowHour, specs, s) {
  return specs.map((spec, i) => {
    const h = at(Object.assign({ hour: (nowHour + i + 1) % 24 }, spec));
    h.hoursFromNow = i + 1;
    h.label = String(h.hour).padStart(2, '0');
    h.score = scoreHour(h, s || S);
    return h;
  });
}

const DRY_NIGHT = { isDay: false, pop: 5, precip: 0, code: 0 };
const WET_NIGHT = { isDay: false, pop: 100, precip: 3, code: 65 };
const FINE_DAY  = { isDay: true,  pop: 5,  precip: 0, code: 0 };

// lovely. The old code reached over midnight and said "go at seven".
const eveningNow = at(Object.assign({ hour: 22 }, WET_NIGHT));
const eveningAhead = since(22, [
  DRY_NIGHT,                                    // 23 — tonight, dry, still dark
  WET_NIGHT, WET_NIGHT, WET_NIGHT, WET_NIGHT,   // 00-03 tomorrow
  WET_NIGHT, WET_NIGHT, WET_NIGHT,              // 04-06 tomorrow
  FINE_DAY, FINE_DAY, FINE_DAY, FINE_DAY        // 07-10 tomorrow, lovely
]);

/* ================= dusk and dawn ================= */

// The half-light hour either side of the sun is some of the nicest light
// of the day, and it used to score exactly like 2am. A night hour next to
// a day hour is twilight: the first dark hour after sunset is dusk, the
// last dark hour before sunrise is dawn.

// Stockholm, UTC+2: light at 18 and 19, dark 20 through 05, light again at 06.
const TWILIGHT_OM = (() => {
  const times = [], isDay = [];
  const light = { 18: 1, 19: 1, 6: 1, 7: 1 };
  for (let i = 0; i < 14; i++) {
    const h = (18 + i) % 24;
    const day = i < 6 ? '2026-09-27' : '2026-09-28';
    times.push(`${day}T${String(h).padStart(2, '0')}:00`);
    isDay.push(light[h] || 0);
  }
  const n = times.length, fill = (v) => Array.from({ length: n }, () => v);
  return {
    utc_offset_seconds: 7200,
    current: { time: '2026-09-27T18:00' },
    hourly: { time: times, is_day: isDay,
      temperature_2m: fill(14), apparent_temperature: fill(13),
      precipitation_probability: fill(10), precipitation: fill(0),
      weather_code: fill(2), wind_speed_10m: fill(8) },
    daily: { sunset: ['2026-09-27T19:26'] }
  };
})();

const twilightOf = (hour) => {
  const f = tgForecast({ om: TWILIGHT_OM });
  const row = [f.now].concat(f.ahead).filter((h) => h.hour === hour)[0];
  return row ? row.twilight : 'missing';
};

check('the first dark hour after sunset is dusk', twilightOf(20), 'dusk');
check('the last dark hour before sunrise is dawn', twilightOf(5), 'dawn');
check('the middle of the night is neither', twilightOf(23), null);
check('a daylight hour is not twilight', twilightOf(19), null);
check('the first light hour after dawn is not twilight', twilightOf(6), null);

check('the default dusk dial is 1', DEFAULTS.twilight, 1);

// An hour at 20:00: dark, not the small hours, a little rain chance so a
// bonus has room to show under the 100 cap.
const duskHour = (o) => at(Object.assign(

check('the sky rating shows as its own row, named after the sky', (() => {

/* ================= ranking the skies into bands ================= */

/* ================= firsts are worth a bonus ================= */

// The first rain after two dry weeks, the first snow of the season, the
// first sun after a grey week, the first warm day of spring: each earns
// +15 on the hours it happens, today. History comes from Open-Meteo's
// daily past_days, so it costs no extra request.

// n days of history, oldest first, then today; `f` fills each field.
function history(n, f) {
  const days = { time: [], precipitation_sum: [], snowfall_sum: [],
                 sunshine_duration: [], apparent_temperature_max: [] };
  for (let i = 0; i <= n; i++) {
    const dt = new Date(Date.UTC(2026, 8, 28) - (n - i) * 86400000);
    days.time.push(dt.toISOString().slice(0, 10));
    const v = f(n - i);   // days ago: n .. 0 (0 is today)
    days.precipitation_sum.push(v.rain || 0);
    days.snowfall_sum.push(v.snow || 0);
    days.sunshine_duration.push(v.sun === undefined ? 6 * 3600 : v.sun);
    days.apparent_temperature_max.push(v.warm === undefined ? 20 : v.warm);
  }
  return days;
}
const today = '2026-09-28';

check('rain after 14 dry days is a first, and says how long it was dry',
  tgNovelty(history(30, (ago) => ({ rain: ago === 16 ? 5 : 0 })), today).rain, 16);

check('rain after 13 dry days is not',
  tgNovelty(history(30, (ago) => ({ rain: ago === 13 ? 5 : 0 })), today).rain, null);

check('a wet spell under 1 mm a day still counts as dry',
  tgNovelty(history(30, () => ({ rain: 0.4 })), today).rain, 30);

check('no snow in the whole season so far makes the first snow a first',
  tgNovelty(history(90, () => ({ sun: 3600 * 5 })), today).snow, true);

check('snow earlier in the season means it is not the first',
  tgNovelty(history(90, (ago) => ({ snow: ago === 40 ? 2 : 0 })), today).snow, false);

check('too little history to know is not claimed as a first',
  tgNovelty(history(20, () => ({})), today).snow, false);

check('sun after a grey week is a first, and says how grey it was',
  tgNovelty(history(30, (ago) => ({ sun: ago >= 1 && ago <= 9 ? 600 : 6 * 3600 })), today).sun, 9);

check('six grey days are not enough',
  tgNovelty(history(30, (ago) => ({ sun: ago >= 1 && ago <= 6 ? 600 : 6 * 3600 })), today).sun, null);

check('the first 15-degree day after a cold spell is a first',
  tgNovelty(history(90, () => ({ warm: 8 })), today).warm, true);

check('a warm day after warm days is not',
  tgNovelty(history(90, (ago) => ({ warm: ago === 50 ? 18 : 8 })), today).warm, false);

check('no history, no firsts', (() => {
  const n = tgNovelty(null, today);
  return [n.rain, n.snow, n.sun, n.warm].join(',');
})(), ',false,,false');

// Integrated: an Open-Meteo payload with 30 dry days, rain this afternoon
// and tomorrow. Only today's rainy hours earn it.
const NOVEL_OM = (() => {
  const hours = [], codes = [], isDay = [], feels = [];
  for (let i = 0; i < 30; i++) {
    const day = i < 11 ? '2026-09-28' : '2026-09-29';
    const h = (13 + i) % 24;
    hours.push(`${day}T${String(h).padStart(2, '0')}:00`);
    codes.push(h === 15 || h === 16 || h === 0 ? 63 : 3);   // rain at 15, 16 and midnight
    isDay.push(h >= 7 && h < 19 ? 1 : 0);
    feels.push(12);
  }
  const n = hours.length, fill = (v) => Array.from({ length: n }, () => v);
  const daily = history(30, () => ({}));
  daily.time.push('2026-09-29');
  daily.precipitation_sum.push(4); daily.snowfall_sum.push(0);
  daily.sunshine_duration.push(0); daily.apparent_temperature_max.push(12);
  daily.sunset = daily.time.map((t) => (t === today ? `${t}T18:41` : `${t}T20:00`));
  return {
    utc_offset_seconds: 7200,
    current: { time: '2026-09-28T13:10' },
    hourly: { time: hours, weather_code: codes, is_day: isDay,
      temperature_2m: fill(13), apparent_temperature: feels,
      precipitation_probability: fill(20), precipitation: fill(0),
      wind_speed_10m: fill(8) },
    daily
  };
})();

const novelRow = (hour, day) => {
  const f = tgForecast({ om: NOVEL_OM });
  return [f.now].concat(f.ahead).filter((h) => h.hour === hour)[0];
};

check('today\'s rainy hour after a dry spell is marked first rain',
  novelRow(15).novelty + ':' + novelRow(15).noveltyDays, 'rain:30');

check('a dry hour on the same day is not', novelRow(14).novelty, null);

check('rain just after midnight belongs to tomorrow, and earns nothing today',
  novelRow(0).novelty, null);

check('sunset is today\'s, not the oldest day in the history',
  tgForecast({ om: NOVEL_OM }).sunsetMin, 18 * 60 + 41);

// Scoring: +15 on the hour, as its own row, with an off switch.
const firstRain = (o) => at(Object.assign(
  { code: 63, pop: 60, novelty: 'rain', noveltyDays: 16 }, o || {}));

check('a first earns 15',
  scoreHour(firstRain(), S) - scoreHour(firstRain({ novelty: null }), S), 15);

check('the novelty bonus can be switched off',
  scoreHour(firstRain(), Object.assign({}, S, { novelty: false })),
  scoreHour(firstRain({ novelty: null }), S));

check('a first shows as its own row, and says why', (() => {
  const e = tgExplainHour(firstRain(), S);
  const row = e.parts.filter((p) => p.key === 'firstRain')[0];
  return row ? row.amount + ' / ' + factorFact('firstRain', firstRain()) : 'no row';
})(), '15 / ' + T().ui.dryDays(16));

check('the bonus is on by default', DEFAULTS.novelty, true);

check('switching it off is remembered', (() => {
  const real = localStorage.getItem('touchgrass.settings');
  localStorage.setItem('touchgrass.settings', JSON.stringify({ novelty: false }));
  const v = getSettings().novelty;
  if (real === null) localStorage.removeItem('touchgrass.settings');
  else localStorage.setItem('touchgrass.settings', real);
  return v;
})(), false);

check('every first is named in both languages', (() => {
  const named = (code) => {
    localStorage.setItem('touchgrass.lang', code); LANG_CACHE = null;
    const u = T().ui;
    return ['firstRain', 'firstSnow', 'firstSun', 'firstWarm'].every((k) => !!u.factors[k]) &&
           typeof u.dryDays === 'function' && typeof u.greyDays === 'function' &&
           !!u.noveltyToggle;
  };
  const ok = named('en') && named('sv');
  localStorage.setItem('touchgrass.lang', 'en'); LANG_CACHE = null;
  return ok;
})(), true);

/* ================= changing a day in the popup ================= */

check('a day goes up one trip at a time', stepTrips(2, +1), 3);
check('a day stops at five', stepTrips(5, +1), 5);
check('a day goes down one trip at a time', stepTrips(3, -1), 2);
check('a day cannot go below none', stepTrips(0, -1), 0);
check('a day already past five (from the Today button) can still come down',
  stepTrips(8, -1), 7);
check('a day already past five is not pushed further up', stepTrips(8, +1), 8);
check('the most the popup allows is five', TRIPS_MAX, 5);

/* ================= sliding between months ================= */

const SEPT = new Date(2026, 8, 28);   // "now" for these

check('back from January is December of the year before',
  JSON.stringify(shiftMonth(2026, 0, -1, SEPT)), JSON.stringify({ year: 2025, month: 11 }));
check('forward from December is January of the next year',
  JSON.stringify(shiftMonth(2025, 11, +1, SEPT)), JSON.stringify({ year: 2026, month: 0 }));
check('forward from last month reaches this month',
  JSON.stringify(shiftMonth(2026, 7, +1, SEPT)), JSON.stringify({ year: 2026, month: 8 }));
check('forward from this month goes nowhere: it has not happened yet',
  shiftMonth(2026, 8, +1, SEPT), null);
check('back is always allowed',
  JSON.stringify(shiftMonth(2026, 8, -1, SEPT)), JSON.stringify({ year: 2026, month: 7 }));

/* ================= the aurora ================= */

// Aurora follows geomagnetic latitude, not geographic. The oval's edge
// sits near 66.5 degrees at Kp 0 and moves about 2.05 degrees south per
// Kp. Dark, clear-ish hours earn +20 when it reaches you (likely) and +10
// when it is within two degrees (possible, low on the northern horizon).

const near = (a, b, tol) => Math.abs(a - b) <= tol;

check('Stockholm is about 58 degrees geomagnetic',
  near(tgGeomagLat(59.33, 18.07), 58.0, 0.6), true);
check('Kiruna is about 65.6 degrees geomagnetic',
  near(tgGeomagLat(67.86, 20.23), 65.6, 0.6), true);
check('Stockholm needs about Kp 4',
  Math.round(tgKpNeeded(tgGeomagLat(59.33, 18.07)) * 10) / 10 >= 3.6 &&
  Math.round(tgKpNeeded(tgGeomagLat(59.33, 18.07)) * 10) / 10 <= 4.6, true);
check('inside the oval, any Kp will do', tgKpNeeded(70), 0);

const KP = [
  { time_tag: '2026-09-28T15:00:00', kp: 2.33, observed: 'observed' },
  { time_tag: '2026-09-28T18:00:00', kp: 5.0, observed: 'predicted' },
  { time_tag: '2026-09-28T21:00:00', kp: 3.67, observed: 'predicted' },
  { time_tag: '2026-09-29T00:00:00', kp: 1.0, observed: 'predicted' }
];

check('an hour takes the Kp of the three-hour block it falls in',
  tgKpAt(KP, '2026-09-28T20:00:00Z'), 5.0);
check('the block boundary belongs to the new block',
  tgKpAt(KP, '2026-09-28T21:00:00Z'), 3.67);
check('an hour past the end of the forecast has no Kp, not the last one',
  tgKpAt(KP, '2026-09-29T05:00:00Z'), null);
check('an hour before the forecast starts has no Kp',
  tgKpAt(KP, '2026-09-28T09:00:00Z'), null);
check('a malformed Kp payload has no Kp',
  tgKpAt({ nonsense: true }, '2026-09-28T20:00:00Z'), null);

// A slice of the OVATION grid: [lon 0..359, lat, percent].
const OVAL = { coordinates: [
  [18, 58, 1], [18, 59, 4], [18, 61, 22], [18, 64, 41], [18, 65, 70],
  [19, 60, 90],                 // next longitude over: not ours
  [340, 64, 55]                 // 20 W
] };

check('OVATION reads the strongest point from here to five degrees north',
  tgOvationAt(OVAL, 59.33, 18.07), 41);
check('a western longitude wraps onto the 0-359 grid',
  tgOvationAt(OVAL, 62, -20), 55);
check('nothing on the grid for this spot is no reading',
  tgOvationAt(OVAL, 30, 100), null);

const darkClear = (o) => Object.assign(
  { time: '2026-09-28T20:00:00Z', isDay: false, twilight: null, code: 2 }, o || {});
const needHere = tgKpNeeded(58);

check('Kp that reaches you, dark and clear, is likely',
  tgAuroraFor(darkClear(), 5.0, needHere, null).level, 'likely');
check('Kp that nearly reaches you is possible',
  tgAuroraFor(darkClear(), needHere - 0.5, needHere, null).level, 'possible');
check('Kp well short of you is nothing',
  tgAuroraFor(darkClear(), needHere - 2, needHere, null).level, null);
check('daylight hides it',
  tgAuroraFor(darkClear({ isDay: true }), 7, needHere, null).level, null);
check('the twilight hour is too light for it',
  tgAuroraFor(darkClear({ twilight: 'dusk' }), 7, needHere, null).level, null);
check('overcast hides it',
  tgAuroraFor(darkClear({ code: 3 }), 7, needHere, null).level, null);
check('OVATION speaks for the hour it covers, over Kp',
  tgAuroraFor(darkClear(), 1, needHere, 41).level, 'likely');
check('a weak OVATION reading is possible',
  tgAuroraFor(darkClear(), 7, needHere, 12).level, 'possible');
check('a faint OVATION reading is nothing, whatever Kp says',
  tgAuroraFor(darkClear(), 7, needHere, 3).level, null);

// Scoring
const auroraHour = (level) => at({ hour: 22, isDay: false, code: 0,
  aurora: level, auroraSource: 'kp', auroraValue: 5 });

check('a likely aurora earns 20',
  scoreHour(auroraHour('likely'), S) - scoreHour(auroraHour(null), S), 20);
check('a possible aurora earns 10',
  scoreHour(auroraHour('possible'), S) - scoreHour(auroraHour(null), S), 10);
check('the aurora bonus can be switched off',
  scoreHour(auroraHour('likely'), Object.assign({}, S, { aurora: false })),
  scoreHour(auroraHour(null), S));
check('the aurora bonus is on by default', DEFAULTS.aurora, true);
check('the aurora shows as its own row, with its Kp', (() => {
  const e = tgExplainHour(auroraHour('likely'), S);
  const row = e.parts.filter((p) => p.key === 'auroraLikely')[0];
  return row ? row.amount + ' / ' + factorFact('auroraLikely', auroraHour('likely')) : 'no row';
})(), '20 / ' + T().ui.kpFact(5));

// The forecast: Stockholm on a dark evening with Kp 5 between 18 and 21 UTC.
const AURORA_OM = (() => {
  const hours = [], isDay = [], codes = [];
  for (let i = 0; i < 14; i++) {
    const h = (21 + i) % 24;
    const day = i < 3 ? '2026-09-28' : '2026-09-29';
    hours.push(`${day}T${String(h).padStart(2, '0')}:00`);
    isDay.push(h >= 7 && h < 19 ? 1 : 0);
    codes.push(h === 23 ? 3 : 0);          // cloud at 23:00 local only
  }
  const n = hours.length, fill = (v) => Array.from({ length: n }, () => v);
  return {
    latitude: 59.33, longitude: 18.07, utc_offset_seconds: 7200,
    current: { time: '2026-09-28T21:10' },
    hourly: { time: hours, is_day: isDay, weather_code: codes,
      temperature_2m: fill(8), apparent_temperature: fill(6),
      precipitation_probability: fill(0), precipitation: fill(0),
      wind_speed_10m: fill(6) },
    daily: { time: ['2026-09-28', '2026-09-29'], sunset: ['2026-09-28T18:40', '2026-09-29T18:37'] }
  };
})();

const auroraRow = (f, hour) => [f.now].concat(f.ahead).filter((h) => h.hour === hour)[0];

check('the forecast marks a likely aurora from Kp', (() => {
  const f = tgForecast({ om: AURORA_OM, kp: KP });
  const r = auroraRow(f, 22);                 // 20:00 UTC, Kp 5
  return r.aurora + ':' + r.auroraSource + ':' + r.auroraValue;
})(), 'likely:kp:5');

check('a cloudy hour in the same storm is not marked',
  auroraRow(tgForecast({ om: AURORA_OM, kp: KP }), 23).aurora, null);

check('without a Kp forecast nothing is marked',
  auroraRow(tgForecast({ om: AURORA_OM }), 22).aurora, null);

check('OVATION refines the current hour only', (() => {
  const f = tgForecast({ om: AURORA_OM, kp: KP, ovation: { coordinates: [[18, 60, 3]] } });
  return f.now.aurora + ',' + auroraRow(f, 22).aurora;
})(), 'null,likely');

check('OVATION is worth fetching on a dark, clear, active night',
  tgWantsOvation(tgForecast({ om: AURORA_OM, kp: KP })), true);
check('OVATION is not worth fetching when Kp is quiet',
  tgWantsOvation(tgForecast({ om: AURORA_OM, kp: [
    { time_tag: '2026-09-28T18:00:00', kp: 1 }] })), false);

check('the aurora is named in both languages', (() => {
  const named = (code) => {
    localStorage.setItem('touchgrass.lang', code); LANG_CACHE = null;
    const u = T().ui;
    return !!u.factors.auroraLikely && !!u.factors.auroraPossible &&
      typeof u.kpFact === 'function' && typeof u.ovalFact === 'function' &&
      !!u.auroraToggle && !!u.auroraAlert;
  };
  const ok = named('en') && named('sv');
  localStorage.setItem('touchgrass.lang', 'en'); LANG_CACHE = null;
  return ok;
})(), true);

/* ================= report ================= */

if (REAL_LANG === null) localStorage.removeItem('touchgrass.lang');
else localStorage.setItem('touchgrass.lang', REAL_LANG);

out.innerHTML = lines.map((l) =>
  `<span class="${l.startsWith('PASS') ? 'p' : 'f'}">${l.replace(/[<&]/g, (c) => c === '<' ? '&lt;' : '&amp;')}</span>`

document.title = `${nPass} passed, ${nFail} failed`;
